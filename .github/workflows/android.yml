name: Android APK

on:
  workflow_dispatch:
    inputs:
      host:
        description: Address the app opens (no https://)
        default: speechify-web.onrender.com
        required: true
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Signing Keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "Signing with release keystore"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: building installable debug APK"
          fi

      - name: Build Android APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HOST: ${{ github.event.inputs.host || 'speechify-web.onrender.com' }}
        run: |
          if [ -n "${KEYSTORE_FILE:-}" ]; then
            gradle --no-daemon assembleRelease -Phost="$HOST"
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/speechify.apk"
          else
            gradle --no-daemon assembleDebug -Phost="$HOST"
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/speechify.apk"
          fi
          echo "APK generated successfully for https://$HOST/ :"
          ls -lh "$RUNNER_TEMP/speechify.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: speechify-apk
          path: '${{ runner.temp }}/speechify.apk'
          retention-days: 90
