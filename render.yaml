services:
  - type: web
    name: speechify-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn speechify_local.server:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: LOCAL_WORKER_URL
        sync: false
      - key: WORKER_SECRET_KEY
        generateValue: true
