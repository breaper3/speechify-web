services:
  - type: web
    name: speechify-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn speechify_local.server:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: LOCAL_WORKER_URL
        value: https://hist-recorder-rebecca-titten.trycloudflare.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
